<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d6efd" />
  <meta name="description" content="Pipe Hopper — a playful Plumber Today arcade game." />
  <title>Pipe Hopper | Plumber Today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="brand-bar">
      <div class="brand-mark" aria-label="Plumber Today">
        <span class="brand-drop">◆</span>
        <span>PLUMBER <b>TODAY</b></span>
      </div>
      <div class="scoreboard" aria-live="polite">
        <div><small>SCORE</small><strong id="score">0</strong></div>
        <div><small>BEST</small><strong id="best">0</strong></div>
      </div>
    </header>

    <section class="game-card">
      <canvas id="game" aria-label="Pipe Hopper game area" tabindex="0"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="hero-icon" aria-hidden="true">💩</div>
          <p class="eyebrow">PLUMBER TODAY PRESENTS</p>
          <h1 id="overlay-title">Pipe Hopper</h1>
          <p id="overlay-copy">Keep the plumber flying, dodge the pipes, and save the day!</p>
          <button id="start-button" type="button">Start Fixing <span>→</span></button>
          <a class="site-link" id="site-link" href="https://myplumbertoday.com" target="_blank" rel="noreferrer">Visit myPlumberToday.com ↗</a>
          <p class="hint">Tap, click, or press <kbd>SPACE</kbd> to flap</p>
        </div>
      </div>
    </section>

    <footer>
      <p>Every pipe deserves a hero.</p>
      <a href="https://myplumbertoday.com" target="_blank" rel="noreferrer">Book a plumber at myPlumberToday.com <span>↗</span></a>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
